<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tare 智能体表单填写测试</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8eaff 50%, #f5f0ff 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #1a1a2e;
    }
    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .page-header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .page-header p { color: #64748b; font-size: 14px; }
    .form-container {
      max-width: 680px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.08);
      border: 1px solid #e8e8f5;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #4338ca;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #ede9fe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 2px;
      display: inline-block;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-row.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    .form-group label .required {
      color: #ef4444;
      margin-left: 2px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s;
      background: #fafafa;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      background: #fff;
    }
    .form-group input.error,
    .form-group select.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .error-msg {
      font-size: 12px;
      color: #ef4444;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Password toggle */
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input { width: 100%; padding-right: 40px; }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 13px;
      padding: 2px 4px;
    }
    .toggle-pwd:hover { color: #6366f1; }

    /* Radio & Checkbox */
    .option-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      padding: 6px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      transition: all 0.2s;
      background: #fafafa;
    }
    .option-item:hover {
      border-color: #a5b4fc;
      background: #eef2ff;
    }
    .option-item input[type="radio"],
    .option-item input[type="checkbox"] {
      accent-color: #6366f1;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .option-item.checked {
      border-color: #6366f1;
      background: #eef2ff;
    }

    /* File upload */
    .file-upload-area {
      border: 2px dashed #c7d2fe;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafbff;
      position: relative;
    }
    .file-upload-area:hover {
      border-color: #6366f1;
      background: #eef2ff;
    }
    .file-upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-upload-area .upload-icon {
      font-size: 32px;
      margin-bottom: 8px;
      color: #a5b4fc;
    }
    .file-upload-area .upload-text { color: #64748b; font-size: 13px; }
    .file-upload-area .file-name {
      color: #6366f1;
      font-weight: 500;
      font-size: 13px;
      margin-top: 6px;
    }
    .photo-preview {
      margin-top: 12px;
      display: none;
    }
    .photo-preview img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #e8e8f5;
    }

    /* Agreement */
    .agreement {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 13px;
      color: #4b5563;
    }
    .agreement input { accent-color: #6366f1; width: 16px; height: 16px; cursor: pointer; }
    .agreement a { color: #6366f1; text-decoration: none; }
    .agreement a:hover { text-decoration: underline; }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 8px;
    }
    .btn {
      padding: 12px 36px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #64748b;
      border: 1.5px solid #d1d5db;
    }
    .btn-secondary:hover { background: #e2e8f0; }

    /* Result */
    .result-card {
      display: none;
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border: 1.5px solid #86efac;
      border-radius: 16px;
      padding: 28px 32px;
      margin-top: 32px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }
    .result-card.show { display: block; }
    .result-title {
      font-size: 18px;
      font-weight: 600;
      color: #166534;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .result-item {
      background: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      border: 1px solid #d1fae5;
    }
    .result-item .label { color: #6b7280; margin-bottom: 2px; }
    .result-item .value { color: #1a1a2e; font-weight: 500; }
    .result-item.full-width { grid-column: 1 / -1; }

    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .card { padding: 20px; }
      .form-row { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>🤖 Tare 智能体表单填写测试</h1>
  <p>用于测试智能体自动填写表单的各项能力</p>
</div>

<div class="form-container">
  <form id="testForm" novalidate>

    <!-- 第一组：基本信息 -->
    <div class="card">
      <div class="card-title">基本信息</div>

      <div class="form-row">
        <div class="form-group">
          <label>姓名 <span class="required">*</span></label>
          <input type="text" name="name" placeholder="请输入您的姓名" aria-label="姓名">
        </div>
        <div class="form-group">
          <label>身份证号 <span class="required">*</span></label>
          <input type="text" name="idCard" placeholder="请输入身份证号码" aria-label="身份证号" maxlength="18">
          <span class="error-msg" id="err-idCard">请输入18位身份证号码</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>邮箱 <span class="required">*</span></label>
          <input type="email" name="email" placeholder="请输入邮箱地址" aria-label="邮箱">
        </div>
        <div class="form-group">
          <label>手机号 <span class="required">*</span></label>
          <input type="tel" name="phone" placeholder="请输入手机号码" aria-label="手机号" maxlength="11">
          <span class="error-msg" id="err-phone">请输入11位手机号码</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>年龄</label>
          <input type="number" name="age" placeholder="请输入年龄" aria-label="年龄" min="1" max="150">
        </div>
        <div class="form-group">
          <label>出生日期</label>
          <input type="date" name="birthday" aria-label="出生日期">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>密码 <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" name="password" placeholder="请输入密码" aria-label="密码">
            <button type="button" class="toggle-pwd" onclick="togglePassword(this)">显示</button>
          </div>
        </div>
        <div class="form-group">
          <label>确认密码 <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" name="confirmPassword" placeholder="请再次输入密码" aria-label="确认密码">
            <button type="button" class="toggle-pwd" onclick="togglePassword(this)">显示</button>
          </div>
          <span class="error-msg" id="err-password">两次输入的密码不一致</span>
        </div>
      </div>
    </div>

    <!-- 第二组：详细信息（下拉框） -->
    <div class="card">
      <div class="card-title">详细信息</div>

      <div class="form-row">
        <div class="form-group">
          <label>性别</label>
          <select name="gender" aria-label="性别">
            <option value="">请选择性别</option>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="form-group">
          <label>城市</label>
          <select name="city" aria-label="城市">
            <option value="">请选择城市</option>
            <option value="beijing">北京</option>
            <option value="shanghai">上海</option>
            <option value="guangzhou">广州</option>
            <option value="shenzhen">深圳</option>
            <option value="hangzhou">杭州</option>
          </select>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>职业</label>
          <select name="occupation" aria-label="职业">
            <option value="">请选择职业</option>
            <option value="student">学生</option>
            <option value="engineer">工程师</option>
            <option value="teacher">教师</option>
            <option value="doctor">医生</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 第三组：偏好设置（单选/多选框） -->
    <div class="card">
      <div class="card-title">偏好设置</div>

      <div class="form-group" style="margin-bottom:16px">
        <label>学历（单选）</label>
        <div class="option-group" id="education-group">
          <label class="option-item">
            <input type="radio" name="education" value="highschool"> 高中
          </label>
          <label class="option-item">
            <input type="radio" name="education" value="bachelor"> 本科
          </label>
          <label class="option-item">
            <input type="radio" name="education" value="master"> 硕士
          </label>
          <label class="option-item">
            <input type="radio" name="education" value="phd"> 博士
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>兴趣爱好（多选）</label>
        <div class="option-group" id="hobby-group">
          <label class="option-item">
            <input type="checkbox" name="hobby" value="reading"> 阅读
          </label>
          <label class="option-item">
            <input type="checkbox" name="hobby" value="sports"> 运动
          </label>
          <label class="option-item">
            <input type="checkbox" name="hobby" value="music"> 音乐
          </label>
          <label class="option-item">
            <input type="checkbox" name="hobby" value="coding"> 编程
          </label>
          <label class="option-item">
            <input type="checkbox" name="hobby" value="travel"> 旅行
          </label>
        </div>
      </div>

      <div class="agreement">
        <input type="checkbox" name="agreement" id="agreement">
        <label for="agreement">我已阅读并同意<a href="javascript:void(0)">《用户协议》</a>和<a href="javascript:void(0)">《隐私政策》</a></label>
      </div>
      <span class="error-msg" id="err-agreement" style="margin-left:24px">请先同意用户协议</span>
    </div>

    <!-- 第四组：照片上传 & 自我介绍 -->
    <div class="card">
      <div class="card-title">照片与介绍</div>

      <div class="form-group" style="margin-bottom:16px">
        <label>上传本人照片</label>
        <div class="file-upload-area" id="uploadArea">
          <input type="file" name="photo" accept="image/*" aria-label="上传本人照片" onchange="previewPhoto(this)">
          <div class="upload-icon">📷</div>
          <div class="upload-text">点击或拖拽上传照片（支持 JPG / PNG）</div>
          <div class="file-name" id="fileName"></div>
          <div class="photo-preview" id="photoPreview">
            <img id="previewImg" src="" alt="预览">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>自我介绍</label>
        <textarea name="bio" placeholder="请简要介绍自己" aria-label="自我介绍" rows="4"></textarea>
      </div>
    </div>

    <!-- 按钮 -->
    <div class="card" style="background:transparent;border:none;box-shadow:none;padding:0">
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">提交表单</button>
        <button type="reset" class="btn btn-secondary" onclick="resetForm()">重置表单</button>
      </div>
    </div>
  </form>
</div>

<!-- 结果展示 -->
<div class="result-card" id="resultCard">
  <div class="result-title">✅ 提交成功！以下是填写结果：</div>
  <div class="result-grid" id="resultGrid"></div>
</div>

<script>
  // 密码显示/隐藏
  function togglePassword(btn) {
    const input = btn.previousElementSibling;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '隐藏';
    } else {
      input.type = 'password';
      btn.textContent = '显示';
    }
  }

  // 照片预览
  function previewPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById('fileName').textContent = file.name;
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('photoPreview').style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  }

  // 选项高亮
  document.querySelectorAll('.option-item input').forEach(function(input) {
    input.addEventListener('change', function() {
      if (this.type === 'radio') {
        this.closest('.option-group').querySelectorAll('.option-item').forEach(function(item) {
          item.classList.remove('checked');
        });
      }
      if (this.checked) {
        this.closest('.option-item').classList.add('checked');
      } else {
        this.closest('.option-item').classList.remove('checked');
      }
    });
  });

  // 表单校验
  function validateForm() {
    let valid = true;
    // 隐藏所有错误
    document.querySelectorAll('.error-msg').forEach(function(el) { el.classList.remove('show'); });
    document.querySelectorAll('.error').forEach(function(el) { el.classList.remove('error'); });

    var idCard = document.querySelector('[name="idCard"]');
    if (idCard.value && !/^\d{17}[\dXx]$/.test(idCard.value)) {
      idCard.classList.add('error');
      document.getElementById('err-idCard').classList.add('show');
      valid = false;
    }

    var phone = document.querySelector('[name="phone"]');
    if (phone.value && !/^1\d{10}$/.test(phone.value)) {
      phone.classList.add('error');
      document.getElementById('err-phone').classList.add('show');
      valid = false;
    }

    var pwd = document.querySelector('[name="password"]');
    var confirmPwd = document.querySelector('[name="confirmPassword"]');
    if (pwd.value && confirmPwd.value && pwd.value !== confirmPwd.value) {
      confirmPwd.classList.add('error');
      document.getElementById('err-password').classList.add('show');
      valid = false;
    }

    var agreement = document.getElementById('agreement');
    if (!agreement.checked) {
      document.getElementById('err-agreement').classList.add('show');
      valid = false;
    }

    return valid;
  }

  // 职业映射
  var occupationMap = { student: '学生', engineer: '工程师', teacher: '教师', doctor: '医生', other: '其他' };
  var genderMap = { male: '男', female: '女' };
  var cityMap = { beijing: '北京', shanghai: '上海', guangzhou: '广州', shenzhen: '深圳', hangzhou: '杭州' };
  var educationMap = { highschool: '高中', bachelor: '本科', master: '硕士', phd: '博士' };
  var hobbyMap = { reading: '阅读', sports: '运动', music: '音乐', coding: '编程', travel: '旅行' };

  // 提交
  document.getElementById('testForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!validateForm()) return;

    var form = this;
    var items = [];

    function add(label, value, full) {
      if (value) items.push({ label: label, value: value, full: !!full });
    }

    add('姓名', form.name.value);
    add('身份证号', form.idCard.value);
    add('邮箱', form.email.value);
    add('手机号', form.phone.value);
    add('年龄', form.age.value);
    add('出生日期', form.birthday.value);
    add('密码', form.password.value ? '••••••' : '');
    add('性别', genderMap[form.gender.value] || '');
    add('城市', cityMap[form.city.value] || '');
    add('职业', occupationMap[form.occupation.value] || '');

    var eduRadio = form.querySelector('[name="education"]:checked');
    add('学历', eduRadio ? educationMap[eduRadio.value] : '');

    var hobbies = [];
    form.querySelectorAll('[name="hobby"]:checked').forEach(function(cb) {
      hobbies.push(hobbyMap[cb.value]);
    });
    add('兴趣爱好', hobbies.join('、'));

    var photoInput = form.querySelector('[name="photo"]');
    add('照片', photoInput.files[0] ? photoInput.files[0].name : '');

    add('自我介绍', form.bio.value, true);

    var grid = document.getElementById('resultGrid');
    grid.innerHTML = '';
    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'result-item' + (item.full ? ' full-width' : '');
      div.innerHTML = '<div class="label">' + item.label + '</div><div class="value">' + item.value + '</div>';
      grid.appendChild(div);
    });

    document.getElementById('resultCard').classList.add('show');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
  });

  // 重置
  function resetForm() {
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('fileName').textContent = '';
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('previewImg').src = '';
    document.querySelectorAll('.error-msg').forEach(function(el) { el.classList.remove('show'); });
    document.querySelectorAll('.error').forEach(function(el) { el.classList.remove('error'); });
    document.querySelectorAll('.option-item').forEach(function(el) { el.classList.remove('checked'); });
    document.querySelectorAll('.toggle-pwd').forEach(function(btn) {
      btn.textContent = '显示';
      btn.previousElementSibling.type = 'password';
    });
  }
</script>

</body>
</html>
